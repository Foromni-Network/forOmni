name: Foromni Roadmap Validation
on:
  pull_request:
    paths:
      - 'roadmap/**'
      - 'scripts/validate-roadmap.mjs'
      - '.github/workflows/roadmap-validation.yml'
  push:
    branches: [main]
    paths:
      - 'roadmap/**'
      - 'scripts/validate-roadmap.mjs'
      - '.github/workflows/roadmap-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate task registry, status evidence and dependencies
        run: node scripts/validate-roadmap.mjs
